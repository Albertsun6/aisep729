name: quality-gates

# 外环质量门禁（SPEC-19）：平台仓自审探针跑在 CI 上
# runner 钉 macos-latest（ADR-007 选项 B 护栏：与本地 BSD 工具行为一致）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probes:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（C15：第三方 Action 必须 SHA-pin，tag 可被移动）
        with:
          fetch-depth: 0   # check-marketplace-sha 需要历史才能判定 sha 时效（浅克隆下会误诊为"sha 不存在"）

      - name: 阶段0 探针（prfaq 结构 + 门禁⓪状态）
        run: bash .claude/skills/e2e-discovery/scripts/check-prfaq.sh specs/platform-pilot/prfaq.md

      - name: 阶段1 探针（PRD 结构 + 门禁⓪串锁）
        run: bash .claude/skills/e2e-requirements/scripts/check-prd.sh specs/platform-pilot/

      - name: 阶段2 探针（设计制品 + 宪法/ADR 规则，终检模式）
        run: bash .claude/skills/e2e-design/scripts/check-design.sh specs/platform-pilot/ --final

      - name: 阶段3 探针（tasks 逐条验证行/复杂度点）
        run: bash .claude/skills/e2e-implement/scripts/check-tasks.sh specs/platform-pilot/

      - name: 平台自审 · 结构（六件套/manifest 驱动/宪法 C4）
        run: bash scripts/check-structure.sh

      - name: 平台自审 · 自包含（宪法 C9 / SPEC-17）
        run: bash scripts/check-selfcontained.sh

      - name: 平台自审 · bash 高危写法（M1 期间同一 bug 犯三次的教训）
        run: bash scripts/check-shell-traps.sh

      - name: 平台自审 · skill 依赖存在性（防脚手架缺口导致静默跳过检查）
        run: bash scripts/check-skill-deps.sh

      - name: 平台自审 · 宪法条款引用（防条款层 fail-open）
        run: bash scripts/check-clause-refs.sh

      - name: 实施手册结构（SPEC-24）
        run: bash scripts/check-manual.sh

      - name: 第三方 Action SHA-pin（宪法 C15 —— 该条款声明了探针却一直没有实现）
        run: bash scripts/check-action-pins.sh

      - name: AI 评审三通道契约（LLM 不得有阻断权）
        run: bash scripts/check-ai-review-contract.sh

      # 只在 main 上跑：sha 必须指向"改动本身所在的 commit"，而 PR 里那个 commit
      # **还不存在** —— 在 PR 上这条断言永远不可满足（鸡生蛋）。
      # 合进 main 后它变得可满足：紧接着推一个只改 marketplace.json 的 commit 即可转绿。
      # main 变红的含义是准确的：**此刻市场分发的确实是旧内容**，去更新 sha。
      - name: 插件市场 sha 时效（钉住旧版本比不钉更危险）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/check-marketplace-sha.sh

      - name: README 门面（链接/命令/已知限制）
        run: bash scripts/check-readme.sh

      - name: 探针负样本（宪法 C13：探针自身必须能证伪）
        run: bash tests/probe-negative/run.sh

      - name: 汇总
        run: echo "✅ 全部探针 + 负样本通过（quality-gates）"
